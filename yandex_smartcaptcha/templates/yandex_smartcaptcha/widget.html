{% if load_script %}<script>(function () {
    if (window.__smartCaptchaScript) return;
    window.__smartCaptchaScript = true;
    var s = document.createElement('script');
    s.src = '{{ script_url }}';
    s.defer = true;
    document.head.appendChild(s);
})();</script>{% endif %}
{# min-height, а не height: вариант со слайдером выше 100 px и иначе наезжает на кнопку под ним #}
<div class="smart-captcha" data-sitekey="{{ client_key }}" data-hl="{{ language }}" style="min-height: 100px; margin-bottom: 1rem"></div>
