name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { python: "3.10", django: "Django>=4.2,<5.0" }
          - { python: "3.12", django: "Django>=5.2,<5.3" }
          - { python: "3.13", django: "Django>=6.0,<6.1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.django }}" -e ".[test]"
      - run: pytest -q

  # Выгрузка на PyPI по тегу v*: Trusted Publishing, без токенов (настраивается на pypi.org)
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
